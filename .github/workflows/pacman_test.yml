name: pacman

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Code
        uses: actions/checkout@v4

      - name: Installing python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: dependencies install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: run flake8
        run: flake8 .

      - name: run mypy strict
        run: mypy --strict . --ignore-missing-imports

      - name: run tests
        run: python -m unittest discover -s Test -p "test_*.py"

  build-exe:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Code
        uses: actions/checkout@v4

      - name: Installing python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: dependencies install
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: PyInstaller compilation
        run: |
          pyinstaller --onefile --noconsole --name "Pacman" pac-man.py

      - name: Publier le .exe dans une Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pacman.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
